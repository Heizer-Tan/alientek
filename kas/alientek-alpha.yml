header:
  version: 14

machine: imx6ull-alientek-alpha
distro: poky
target:
  - alientek-image-update

repos:
  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:
  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
  meta-freescale:
    url: https://git.yoctoproject.org/git/meta-freescale
    branch: scarthgap
  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate.git
    branch: scarthgap
  meta-qt6:
    url: https://github.com/YoeDistro/meta-qt6.git
    branch: "6.8"
  meta-alientek:
    path: meta-alientek

local_conf_header:
  mainline-bsp: |
    IMX_DEFAULT_BSP = "mainline"
    PACKAGE_CLASSES = "package_rpm"
    EXTRA_IMAGE_FEATURES += "debug-tweaks ssh-server-openssh"
  slim-no-nxp-wifi: |
    # poky 默认 DISTRO_FEATURES 含 wifi；再叠加 usbhost 时，
    # packagegroup-base-extended 会强行加入 Wi-Fi 栈，进而拉取
    # firmware-nxp-wifi（github.com/nxp-imx/imx-firmware）。阿尔法第一期无 NXP Wi-Fi。
    DISTRO_FEATURES:remove = "wifi bluetooth 3g nfc"
    BBMASK += "meta-freescale/recipes-bsp/firmware-imx/firmware-nxp-wifi"
  skip-spdx: |
    # poky 默认 INHERIT create-spdx。kas-container 里并行写
    # tmp/deploy/spdx 时会出现 0 字节 json，do_create_runtime_spdx
    # 解析失败（JSONDecodeError: Expecting value）。第一期只要镜像，不产 SBOM。
    INHERIT:remove = "create-spdx"
  providers: |
    PREFERRED_PROVIDER_virtual/bootloader = "u-boot"
    PREFERRED_PROVIDER_virtual/kernel = "linux"
    PREFERRED_VERSION_u-boot = "2026.07%"
    PREFERRED_VERSION_u-boot-tools = "2026.07%"
  build-cache: |
    # downloads 在仓库根（与 build/ 分离）；sstate 仍用 build/sstate-cache
    # （首次改 DL_DIR 时勿丢弃已有 build/downloads，应迁到 ../downloads）
    DL_DIR ?= "${TOPDIR}/../downloads"
    SSTATE_DIR ?= "${TOPDIR}/sstate-cache"
  qt6-linuxfb: |
    DISTRO_FEATURES:remove = "x11 wayland opengl"
    QT_GIT = "git://github.com"
    QT_GIT_PROTOCOL = "https"
